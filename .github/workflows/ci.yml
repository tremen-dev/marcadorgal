name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run gates
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Version gate (PR)
        if: github.event_name == 'pull_request'
        run: node tools/version-gate.mjs --base "origin/${{ github.base_ref }}"
      - name: Version gate (push a main)
        if: github.event_name == 'push'
        run: node tools/version-gate.mjs --base "${{ github.event.before }}"
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Imagen oficial de Playwright: trae Chromium y sus dependencias del
    # sistema, así el job no depende de apt ni de los mirrors de Ubuntu
    # (2026-11-11: fallos de DNS al resolver archive.ubuntu.com).
    # La etiqueta debe coincidir con la versión de @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
