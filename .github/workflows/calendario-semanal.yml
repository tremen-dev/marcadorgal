# Sincronización semanal del calendario declarado (SPEC-008 CA-8, H-5).
# El calendario de data/calendario/** es la fuente de verdad (D-3): el sync
# propone en un PR y un humano ve los aplazamientos antes de que entren en
# base. calendario:sync reescribe ficheros, así que no puede vivir en una
# función serverless de filesystem de solo lectura.
name: calendario-semanal
on:
  schedule:
    # Martes a las 05:00Z: entre jornadas, con tiempo de revisar antes del
    # viernes.
    - cron: '0 5 * * 2'
  workflow_dispatch:
    inputs:
      temporada:
        default: '2026-27'
      cargar:
        description: "si: corre solo el job load contra la base"
        default: 'no'
  push:
    branches: [main]
    paths:
      - 'data/calendario/**'
      - 'data/alias/**'

jobs:
  sync:
    if: github.event_name != 'push' && inputs.cargar != 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      TEMPORADA: ${{ inputs.temporada || '2026-27' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Clon completo: el paso del PR necesita conocer la rama remota
          # chore/calendario-<fecha> cuando ya existe, y un clon superficial
          # no trae ni su referencia de seguimiento ni sus objetos.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Sincronizar contra el proveedor
        # shell: bash da "bash --noprofile --norc -eo pipefail {0}". Sin él el
        # shell por omisión es "bash -e {0}", sin pipefail, y el estado del
        # paso sería el de tee (siempre 0) en vez del de calendario:sync, que
        # sale 1 cuando el proveedor devuelve errors: el proveedor caería un
        # martes, el paso pasaría, no habría diff, no se abriría PR y nadie se
        # enteraría (O-2 de la verificación).
        shell: bash
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: npm run calendario:sync -- "$TEMPORADA" | tee sync-diff.txt
      - name: ¿Hay diff en el calendario declarado?
        id: diff
        run: |
          if [ -z "$(git status --porcelain data/calendario data/alias)" ]; then
            echo "cambios=no" >> "$GITHUB_OUTPUT"
            echo "El proveedor no trae cambios: no se abre PR."
          else
            echo "cambios=si" >> "$GITHUB_OUTPUT"
          fi
      - name: Abrir o actualizar el PR
        if: steps.diff.outputs.cambios == 'si'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fecha="$(date -u +%Y-%m-%d)"
          rama="chore/calendario-$fecha"
          {
            echo "Sincronización semanal del calendario declarado de \`$TEMPORADA\`."
            echo
            echo "Salida de \`npm run calendario:sync\`:"
            echo
            echo '```'
            cat sync-diff.txt
            echo '```'
            echo
            echo "Fusiona solo si los aplazamientos y los cambios de horario son correctos (D-3)."
          } > "$RUNNER_TEMP/cuerpo.md"
          rm -f sync-diff.txt

          # El resultado del sync, a salvo del checkout que viene ahora.
          cp -R data/calendario data/alias "$RUNNER_TEMP/"

          # La rama ya existe a partir del segundo martes, porque este mismo
          # paso contempla que el PR esté abierto. Se construye ENCIMA de ella
          # en vez de reescribirla: así el push es un avance rápido, no hace
          # falta --force ni --force-with-lease, y nada de lo que haya en esa
          # rama se pierde. Si alguien hubiera empujado algo entre el fetch y
          # el push, el push se rechaza y el job falla, que es lo que tiene
          # que pasar.
          if git ls-remote --exit-code --heads origin "$rama" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/$rama:refs/remotes/origin/$rama"
            git checkout -f -B "$rama" "refs/remotes/origin/$rama"
          else
            git checkout -f -B "$rama"
          fi

          rm -rf data/calendario data/alias
          cp -R "$RUNNER_TEMP/calendario" "$RUNNER_TEMP/alias" data/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendario data/alias
          if git diff --cached --quiet; then
            echo "La rama $rama ya trae este calendario: no se añade commit."
          else
            git commit -m "chore(calendario): sincronización semanal $fecha"
            git push origin "HEAD:refs/heads/$rama"
          fi

          if gh pr view "$rama" --json number >/dev/null 2>&1; then
            gh pr edit "$rama" --body-file "$RUNNER_TEMP/cuerpo.md"
          else
            gh pr create --base main --head "$rama" \
              --title "chore(calendario): sincronización semanal $fecha" \
              --body-file "$RUNNER_TEMP/cuerpo.md"
          fi

  load:
    if: github.event_name == 'push' || inputs.cargar == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEMPORADA: ${{ inputs.temporada || '2026-27' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cargar el calendario en la base
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run calendario:load -- "$TEMPORADA"
