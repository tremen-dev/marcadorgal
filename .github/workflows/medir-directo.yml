# Medición puntual de latencia del directo de API-Football (ver tools/medir-directo.mjs).
# Programado para el domingo 2026-09-21 a las 16:50 CEST (14:50 UTC). Se puede lanzar
# a mano desde Actions. Borrar este fichero cuando la medición esté hecha.
name: medir-directo
on:
  schedule:
    - cron: '50 14 * * 0'
  workflow_dispatch:
    inputs:
      intervalo_s:
        default: '90'
      duracion_min:
        default: '100'
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Sondear el directo
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node tools/medir-directo.mjs "${{ inputs.intervalo_s || '90' }}" "${{ inputs.duracion_min || '100' }}"
      - name: Resumen (solo cambios)
        if: always()
        run: grep -vE ' tick #' tools/medicion-*.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medicion-directo
          path: tools/medicion-*.log
          retention-days: 30
