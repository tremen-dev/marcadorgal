    <rect x="34" y="14" width="8" height="80" fill="#004B9B"/>
    <rect x="50" y="14" width="8" height="80" fill="#004B9B"/>
    <rect x="66" y="14" width="8" height="80" fill="#004B9B"/>
    <!-- ABANCA ribbon -->
    <rect x="15" y="58" width="70" height="18" rx="3" fill="#004B9B" stroke="#FFFFFF" stroke-width="1"/>
    <text x="50" y="70" font-family="'Geist', sans-serif" font-size="7" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">ABANCA</text>
  </g>
  <circle cx="50" cy="54" r="38" fill="none" stroke="#F0B135" stroke-width="2"/>
</svg>
